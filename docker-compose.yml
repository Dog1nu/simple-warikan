services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: warikan
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/warikan
    ports: 
      - 3000:3000
    depends_on: 
      - db    
    volumes:
      - ./backend:/app
      - /app/node_modules

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - 5173:5173
    depends_on:
      backend: 
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    

 
volumes:
  postgres_data:




